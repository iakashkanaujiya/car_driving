<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="640" viewBox="0 0 1536 640" role="img" aria-labelledby="title description">
  <title id="title">Driftline hand controls</title>
  <desc id="description">Three steps show how to calibrate with two fists, rotate both hands to steer, and raise both thumbs to brake.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071017"/>
      <stop offset="0.5" stop-color="#101c24"/>
      <stop offset="1" stop-color="#05090d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#182731"/>
      <stop offset="1" stop-color="#0b1319"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2ff52"/>
      <stop offset="1" stop-color="#b4ff3d"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="fist">
      <rect x="-48" y="-36" width="96" height="86" rx="30" fill="#dce8e9"/>
      <rect x="-44" y="-65" width="21" height="51" rx="10" fill="#dce8e9"/>
      <rect x="-18" y="-72" width="22" height="57" rx="11" fill="#e8f1f1"/>
      <rect x="9" y="-68" width="22" height="54" rx="11" fill="#dce8e9"/>
      <rect x="35" y="-56" width="20" height="48" rx="10" fill="#cbdadc"/>
      <rect x="-30" y="42" width="60" height="48" rx="18" fill="#b8cbce"/>
      <path d="M-47 8 C-77 -2 -82 28 -58 42 L-31 48 L-23 19 Z" fill="#cbdadc"/>
      <path d="M-35 -6 H34" stroke="#879da2" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    </g>
    <g id="thumb-fist">
      <rect x="-48" y="-26" width="96" height="78" rx="29" fill="#dce8e9"/>
      <rect x="-42" y="-50" width="21" height="39" rx="10" fill="#dce8e9"/>
      <rect x="-17" y="-55" width="22" height="44" rx="11" fill="#e8f1f1"/>
      <rect x="10" y="-51" width="22" height="41" rx="11" fill="#dce8e9"/>
      <rect x="35" y="-43" width="20" height="36" rx="10" fill="#cbdadc"/>
      <rect x="-30" y="44" width="60" height="46" rx="18" fill="#b8cbce"/>
      <rect x="-43" y="-130" width="31" height="112" rx="15" fill="#e8f1f1" transform="rotate(-5 -28 -18)"/>
      <path d="M-43 -23 C-63 -14 -64 13 -45 26 L-21 33 L-14 -11 Z" fill="#cbdadc"/>
      <path d="M-34 -2 H34" stroke="#879da2" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    </g>
  </defs>

  <rect width="1536" height="640" rx="28" fill="url(#background)"/>
  <path d="M0 0 H1536 V7 H0 Z" fill="url(#acid)"/>
  <text x="72" y="82" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="8">DRIFTLINE SYSTEM GUIDE</text>
  <text x="72" y="132" fill="#f5f8f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" letter-spacing="2">HOW HAND CONTROL WORKS</text>
  <text x="1464" y="111" text-anchor="end" fill="#769099" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3">CAMERA PROCESSING STAYS LOCAL</text>

  <g transform="translate(52 174)">
    <rect width="448" height="400" rx="22" fill="url(#panel)" stroke="#314650" stroke-width="2"/>
    <text x="28" y="46" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="3">01  CALIBRATE</text>
    <text x="28" y="79" fill="#93aab1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">HOLD TWO CLOSED HANDS APART</text>
    <path d="M105 220 H343" stroke="#f2ff52" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 12" opacity=".8"/>
    <circle cx="224" cy="220" r="91" fill="none" stroke="#263b44" stroke-width="15"/>
    <circle cx="224" cy="220" r="91" fill="none" stroke="#f2ff52" stroke-width="5" stroke-dasharray="76 28" opacity=".55"/>
    <g transform="translate(119 220) scale(.78)"><use href="#fist"/></g>
    <g transform="translate(329 220) scale(-.78 .78)"><use href="#fist"/></g>
    <path d="M184 219 H264" stroke="#f2ff52" stroke-width="4" stroke-linecap="round"/>
    <path d="M195 208 L184 219 L195 230 M253 208 L264 219 L253 230" fill="none" stroke="#f2ff52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="224" y="354" text-anchor="middle" fill="#dbe6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">KEEP BOTH FISTS LEVEL AND STEADY</text>
  </g>

  <g transform="translate(544 174)">
    <rect width="448" height="400" rx="22" fill="url(#panel)" stroke="#314650" stroke-width="2"/>
    <text x="28" y="46" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="3">02  STEER</text>
    <text x="28" y="79" fill="#93aab1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">ROTATE BOTH HANDS LIKE A WHEEL</text>
    <g transform="translate(224 218) rotate(-18)">
      <circle r="101" fill="none" stroke="#263b44" stroke-width="17"/>
      <circle r="101" fill="none" stroke="#f2ff52" stroke-width="5" stroke-dasharray="96 34" opacity=".7"/>
      <path d="M-72 0 H72 M0 0 V76" stroke="#425a64" stroke-width="12" stroke-linecap="round"/>
      <circle r="21" fill="#f2ff52" stroke="#071017" stroke-width="7"/>
      <g transform="translate(-104 0) scale(.76)"><use href="#fist"/></g>
      <g transform="translate(104 0) scale(-.76 .76)"><use href="#fist"/></g>
    </g>
    <path d="M119 134 A137 137 0 0 1 334 126" fill="none" stroke="#55ffc2" stroke-width="5" stroke-linecap="round"/>
    <path d="M327 113 L338 126 L321 131" fill="none" stroke="#55ffc2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="224" y="354" text-anchor="middle" fill="#dbe6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">YOUR HAND ANGLE CONTROLS THE CAR</text>
  </g>

  <g transform="translate(1036 174)">
    <rect width="448" height="400" rx="22" fill="url(#panel)" stroke="#314650" stroke-width="2"/>
    <text x="28" y="46" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="3">03  BRAKE</text>
    <text x="28" y="79" fill="#93aab1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">RAISE BOTH THUMBS TO SLOW DOWN</text>
    <circle cx="224" cy="216" r="115" fill="#ff5148" opacity=".07" filter="url(#glow)"/>
    <g transform="translate(141 235) scale(.76)"><use href="#thumb-fist"/></g>
    <g transform="translate(307 235) scale(-.76 .76)"><use href="#thumb-fist"/></g>
    <rect x="168" y="294" width="112" height="42" rx="21" fill="#ff5148" filter="url(#glow)"/>
    <text x="224" y="322" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="4">BRAKE</text>
    <text x="224" y="370" text-anchor="middle" fill="#dbe6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">LOWER EITHER THUMB TO RELEASE</text>
  </g>
</svg>
