<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="640" aria-labelledby="title description" role="img" viewBox="0 0 1536 640"><title id="title">Driftline hand controls</title><desc id="description">Three steps show how to calibrate with two fists, rotate both hands to steer, raise both thumbs for half braking, and show both palms for a full stop.</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071017"/><stop offset=".5" stop-color="#101c24"/><stop offset="1" stop-color="#05090d"/></linearGradient><linearGradient id="panel" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#182731"/><stop offset="1" stop-color="#0b1319"/></linearGradient><linearGradient id="acid" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f2ff52"/><stop offset="1" stop-color="#b4ff3d"/></linearGradient><filter id="glow" width="260%" height="260%" x="-80%" y="-80%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><g id="fist"><rect width="96" height="86" x="-48" y="-36" fill="#dce8e9" rx="30"/><rect width="21" height="51" x="-44" y="-65" fill="#dce8e9" rx="10"/><rect width="22" height="57" x="-18" y="-72" fill="#e8f1f1" rx="11"/><rect width="22" height="54" x="9" y="-68" fill="#dce8e9" rx="11"/><rect width="20" height="48" x="35" y="-56" fill="#cbdadc" rx="10"/><rect width="60" height="48" x="-30" y="42" fill="#b8cbce" rx="18"/><path fill="#cbdadc" d="M-47 8 C-77 -2 -82 28 -58 42 L-31 48 L-23 19 Z"/><path stroke="#879da2" stroke-linecap="round" stroke-width="5" d="M-35 -6 H34" opacity=".65"/></g><g id="thumb-fist"><rect width="96" height="78" x="-48" y="-26" fill="#dce8e9" rx="29"/><rect width="21" height="39" x="-42" y="-50" fill="#dce8e9" rx="10"/><rect width="22" height="44" x="-17" y="-55" fill="#e8f1f1" rx="11"/><rect width="22" height="41" x="10" y="-51" fill="#dce8e9" rx="11"/><rect width="20" height="36" x="35" y="-43" fill="#cbdadc" rx="10"/><rect width="60" height="46" x="-30" y="44" fill="#b8cbce" rx="18"/><rect width="31" height="112" x="-43" y="-130" fill="#e8f1f1" rx="15" transform="rotate(-5 -28 -18)"/><path fill="#cbdadc" d="M-43 -23 C-63 -14 -64 13 -45 26 L-21 33 L-14 -11 Z"/><path stroke="#879da2" stroke-linecap="round" stroke-width="5" d="M-34 -2 H34" opacity=".65"/></g></defs><rect width="1536" height="640" fill="url(#background)" rx="28"/><path fill="url(#acid)" d="M0 0 H1536 V7 H0 Z"/><text x="72" y="82" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="8">DRIFTLINE SYSTEM GUIDE</text><text x="72" y="132" fill="#f5f8f8" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900" letter-spacing="2">HOW HAND CONTROL WORKS</text><text x="1464" y="111" fill="#769099" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="3" text-anchor="end">CAMERA PROCESSING STAYS LOCAL</text><g transform="translate(52 174)"><rect width="448" height="400" fill="url(#panel)" stroke="#314650" stroke-width="2" rx="22"/><text x="28" y="46" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="3">01 CALIBRATE</text><text x="28" y="79" fill="#93aab1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">HOLD TWO CLOSED HANDS APART</text><path stroke="#f2ff52" stroke-dasharray="10 12" stroke-linecap="round" stroke-width="4" d="M105 220 H343" opacity=".8"/><circle cx="224" cy="220" r="91" fill="none" stroke="#263b44" stroke-width="15"/><circle cx="224" cy="220" r="91" fill="none" stroke="#f2ff52" stroke-dasharray="76 28" stroke-width="5" opacity=".55"/><g transform="translate(119 220) scale(.78)"><use href="#fist"/></g><g transform="translate(329 220) scale(-.78 .78)"><use href="#fist"/></g><path stroke="#f2ff52" stroke-linecap="round" stroke-width="4" d="M184 219 H264"/><path fill="none" stroke="#f2ff52" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M195 208 L184 219 L195 230 M253 208 L264 219 L253 230"/><text x="224" y="354" fill="#dbe6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">KEEP BOTH FISTS LEVEL AND STEADY</text></g><g transform="translate(544 174)"><rect width="448" height="400" fill="url(#panel)" stroke="#314650" stroke-width="2" rx="22"/><text x="28" y="46" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="3">02 STEER</text><text x="28" y="79" fill="#93aab1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">ROTATE BOTH HANDS LIKE A WHEEL</text><g transform="translate(224 218) rotate(-18)"><circle r="101" fill="none" stroke="#263b44" stroke-width="17"/><circle r="101" fill="none" stroke="#f2ff52" stroke-dasharray="96 34" stroke-width="5" opacity=".7"/><path stroke="#425a64" stroke-linecap="round" stroke-width="12" d="M-72 0 H72 M0 0 V76"/><circle r="21" fill="#f2ff52" stroke="#071017" stroke-width="7"/><g transform="translate(-104 0) scale(.76)"><use href="#fist"/></g><g transform="translate(104 0) scale(-.76 .76)"><use href="#fist"/></g></g><path fill="none" stroke="#55ffc2" stroke-linecap="round" stroke-width="5" d="M119 134 A137 137 0 0 1 334 126"/><path fill="none" stroke="#55ffc2" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M327 113 L338 126 L321 131"/><text x="224" y="354" fill="#dbe6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">YOUR HAND ANGLE CONTROLS THE CAR</text></g><g transform="translate(1036 174)"><rect width="448" height="400" fill="url(#panel)" stroke="#314650" stroke-width="2" rx="22"/><text x="28" y="46" fill="#f2ff52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="3">03 BRAKE</text><text x="28" y="79" fill="#93aab1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">THUMBS UP: 50% BRAKE</text><circle cx="224" cy="216" r="115" fill="#ff5148" filter="url(#glow)" opacity=".07"/><g transform="translate(141 235) scale(.76)"><use href="#thumb-fist"/></g><g transform="translate(307 235) scale(-.76 .76)"><use href="#thumb-fist"/></g><rect width="112" height="42" x="168" y="294" fill="#ff5148" filter="url(#glow)" rx="21"/><text x="224" y="322" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="900" letter-spacing="4" text-anchor="middle">BRAKE</text><text x="224" y="370" fill="#dbe6e8" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">SHOW BOTH PALMS FOR FULL STOP</text></g></svg>